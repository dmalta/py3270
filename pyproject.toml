[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py3270"
version = "0.1.0"
description = "Python wrapper for the s3270 IBM 3270 terminal emulator"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires s3270 binary on PATH"]
timeout = 10
